name: Run Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Test ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [builder-frontend, builder-api, library-api, e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup devbox
        uses: ./.github/actions/devbox-setup

      - name: Cache Maven dependencies
        if: matrix.suite != 'builder-frontend'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ matrix.suite }}-${{ hashFiles('builder-api/pom.xml', 'library-api/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ matrix.suite }}-
            ${{ runner.os }}-maven-

      - name: Cache npm downloads
        if: matrix.suite == 'builder-frontend' || matrix.suite == 'e2e'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ matrix.suite }}-${{ hashFiles('builder-frontend/package-lock.json', 'e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ matrix.suite }}-

      # The E2E runner installs both frontend and Playwright dependencies itself.
      - name: Install frontend dependencies
        if: matrix.suite == 'builder-frontend'
        run: devbox run install-builder-frontend-ci

      - name: Cache Firebase emulators
        if: matrix.suite == 'e2e'
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('devbox.lock') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Run tests
        run: devbox run test -- "${{ matrix.suite }}"

      - name: Upload Playwright report
        if: matrix.suite == 'e2e' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload process logs on failure
        if: matrix.suite == 'e2e' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: process-logs
          path: logs/
          retention-days: 30

  deployment-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      builder-api: ${{ steps.changes.outputs.builder-api }}
      builder-frontend: ${{ steps.changes.outputs.builder-frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Keep the existing component-specific deployment triggers. Missing history
      # (for example, a force push) conservatively rebuilds both components.
      - name: Identify deployment changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          for component in builder-api builder-frontend; do
            if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              changed=true
            elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "$component/" devbox.json devbox.lock; then
              changed=false
            else
              changed=true
            fi
            echo "$component=$changed" >> "$GITHUB_OUTPUT"
          done

  deploy-builder-api:
    needs: [tests, deployment-changes]
    if: github.event_name == 'push' && needs.deployment-changes.outputs.builder-api == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-builder-api.yml
    secrets: inherit

  deploy-builder-frontend:
    needs: [tests, deployment-changes]
    if: github.event_name == 'push' && needs.deployment-changes.outputs.builder-frontend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-builder-frontend.yml
    secrets: inherit
