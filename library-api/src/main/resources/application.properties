quarkus.swagger-ui.always-include=true

# OpenAPI Configuration
mp.openapi.filter=org.codeforphilly.bdt.api.DynamicDMNOpenAPIFilter
quarkus.smallrye-openapi.always-run-filter=true

quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite::resource:data/locations.db
quarkus.datasource.jdbc.driver=org.sqlite.JDBC

quarkus.devservices.enabled=false

quarkus.test.continuous-testing=enabled

# Kogito 10.2 intentionally defines decision API types across kogito-api and kogito-dmn.
quarkus.arc.ignored-split-packages=org.kie.kogito.decision

# Kogito's DMN validator compiles an upstream eval rule during augmentation. Drools logs a
# performance hint for that library-owned rule even though application DMN models cannot change it.
quarkus.log.category."org.drools.base.rule.EvalCondition".level=ERROR

# Read by Kogito code generation (not by Quarkus runtime configuration).
kogito.generate.rest.decisions=false

quarkus.http.test-port=0
