quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE
quarkus.http.cors.headers=Authorization,Content-Type

quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite::resource:data/locations.db
quarkus.datasource.jdbc.driver=org.sqlite.JDBC

# auth filtering for all endpoints - secure by default
quarkus.google.cloud.firebase.auth.enabled=true
quarkus.http.auth.permission.secured.paths=/*
quarkus.http.auth.permission.secured.policy=authenticated

quarkus.http.auth.permission.public.paths=/api/published/*
quarkus.http.auth.permission.public.policy=permit

# Library API Configuration
# Defaults to localhost:8083 (development mode)
# For production, set LIBRARY_API_BASE_URL to production Cloud Run URL
library-api.base-url=${LIBRARY_API_BASE_URL:http://localhost:8083}

# Optional AI-backed eligibility check aliases. Without a key, checks are added
# without an alias and the builder tells the user that generation failed.
alias-generation.enabled=${ALIAS_GENERATION_ENABLED:true}
alias-generation.gemini.api-key=${GEMINI_API_KEY:}
alias-generation.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
# Reject requests if extra properties are sent
quarkus.jackson.fail-on-unknown-properties=true
